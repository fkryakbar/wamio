<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta name="description" content="Wamio - Native WhatsApp client built with Wails and Go"/>
    <link rel="icon" type="image/png" href="./src/assets/images/Wamio.png"/>

<div id="root"><div class="boot-splash" role="status" aria-label="Memuat Wamio"><img class="boot-splash__mark" src="./src/assets/images/Wamio.png" alt="" aria-hidden="true"/></div></div>
<script src="./src/main.tsx" type="module"></script>

</html>
